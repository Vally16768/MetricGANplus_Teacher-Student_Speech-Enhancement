schema_version: 1

dataset:
  name: "VoiceBank+DEMAND"
  read_only: true
  source_identity: "external-frozen-manifests"

teacher:
  role: "teacher"
  family: "metricgan_plus_teacher_official_wb"
  bandwidth: "wb"
  sample_rate: 16000
  n_fft: 512
  hop_length: 256
  win_length: 512
  evaluation_reference_bandwidth: "wb"
  initialization: "speechbrain/metricgan-plus-voicebank"
  checkpoint_sha256: "147bfb866bac8264603546e035bf283370e716ed2f4b7412d308d2bcee88304f"

students:
  wb:
    role: "student_wb"
    family: "metricgan_plus_student_wb_causal_max"
    bandwidth: "wb"
    sample_rate: 16000
    n_fft: 512
    hop_length: 160
    win_length: 320
    evaluation_reference_bandwidth: "wb"
  nb:
    role: "student_nb"
    family: "metricgan_plus_student_nb_causal_max"
    bandwidth: "nb"
    sample_rate: 8000
    n_fft: 256
    hop_length: 80
    win_length: 160
    evaluation_reference_bandwidth: "nb"

metric_discriminator:
  target_metric: "PESQ"
  proxy_profiles: ["wb"]
  scope: "teacher_finetune_only"
  generator_weight: 0.25
  frozen_during_generator_update: true

stages:
  - name: "official_teacher_baseline"
    role: "teacher"
    loss: "frozen_checkpoint"
  - name: "student_wb_from_official"
    role: "student_wb"
    loss: "D1"
  - name: "student_nb_from_official"
    role: "student_nb"
    loss: "D1"
  - name: "teacher_finetune_control"
    role: "teacher"
    loss: "T0"
  - name: "teacher_finetune_metric"
    role: "teacher"
    loss: "T0_PESQ"
  - name: "student_wb_from_improved"
    role: "student_wb"
    loss: "D1"
  - name: "student_nb_from_improved"
    role: "student_nb"
    loss: "D1"

teacher_promotion_gate:
  selection_split: "val_select"
  minimum_pesq_gain: 0.01
  maximum_stoi_drop: 0.002
  maximum_sisdr_drop: 0.25

teacher_cache:
  location: "desktop_local_only"
  key: "teacher_checkpoint_sha256 + train_manifest_sha256"
  cache_inputs: false
  storage_dtype: "float16"

tts_extension:
  status: "planned_separate_domain_calibration"
  generator_adapter: "MetricGANGeneratorObjective"
  rule: "Do not reuse an enhancement-only proxy as TTS evidence."

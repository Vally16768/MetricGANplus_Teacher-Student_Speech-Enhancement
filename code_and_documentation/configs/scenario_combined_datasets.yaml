paths:
  project_root: "{project_root}"
  dataset_root: "/home/USER/Desktop/Disc-1TB/ULP-SE-aTENNuate/dataset"
  output_root: "{project_root}/outputs/combined_datasets"
  tracking_root: "{project_root}/tracking/combined_datasets"
  reference_root: "{project_root}/reference"
  reference_export_json: "{project_root}/reference/reference_runs.json"
  teacher_source_checkpoint: "{project_root}/reference/checkpoints/metricgan_plus_native8k_small.pt"
  reference_final_checkpoint: "{project_root}/reference/checkpoints/metricgan_plus_native8k_causal_s_qat.pt"

tracking:
  experiment_name: "metricgan_combined_datasets"

dataset:
  dataset_type: "academic_combined"
  voicebank_root: "{dataset_root}/voicebank-demand"
  dns5_root: "{dataset_root}/dns5-headset-16k"
  voicebank_campaign_dir: "{dataset_root}/voicebank-demand/16k/campaign"
  dns5_train_csv: "{dataset_root}/dns5-headset-16k/train.csv"
  dns5_val_csv: "{dataset_root}/dns5-headset-16k/val.csv"
  # Optional: set dns5_test_csv to an official DNS5 test/dev manifest when available.
  dns5_test_csv: ""
  # If dns5_test_csv is missing, reserve a deterministic 10% split from DNS5 train as test.
  dns5_test_from_train_fraction: 0.10
  voicebank_test_expected_count: 824
  split_seed: 42
  dns5_rank_count: 4096
  combined_train_csv: "{output_root}/combined/train_combined.csv"
  combined_val_rank_csv: "{output_root}/combined/val_rank_combined.csv"
  combined_val_select_csv: "{output_root}/combined/val_select_combined.csv"
  combined_test_csv: "{output_root}/combined/test_combined.csv"

  # Training/eval manifests consumed by training pipeline.
  train_fit_csv: "{output_root}/combined/train_combined.csv"
  val_rank_csv: "{output_root}/combined/val_rank_combined.csv"
  val_select_csv: "{output_root}/combined/val_select_combined.csv"
  test_csv: "{output_root}/combined/test_combined.csv"
  val_speakers: ["p239", "p286", "p244", "p270"]
  rank_count: 128

teacher_cache:
  out_dir: "{output_root}/teacher_cache"
  manifest: "{output_root}/teacher_cache/teacher_cache.csv"
  batch_size: 64
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

io_staging:
  enabled: true
  roots:
    - "/media/USER/D6D6FAA6D6FA8651"
    - "/media/USER/SSD"
  staged_manifest_dir: "{output_root}/combined/staged_manifests"
  stage_subdir: "ULP_STAGE_AUDIO"
  stage_val_test: true
  verify_mode: "size_only"
  verify_hash_every_n: 2000
  copy_workers: 12
  reserve_gb_overrides: {}

training:
  sample_rate: 16000
  n_fft: 512
  hop_length: 160
  win_length: 320
  segment_len: 32000
  # Throughput-tuned for this machine (benchmark on train_combined.csv).
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  # Keep effective batch unchanged (8) with fewer micro-steps.
  batch_size: 8
  grad_accum: 1
  # Fewer but still safe periodic saves: reduce artifact churn and disk pressure.
  checkpoint_every_steps: 0
  checkpoint_every_minutes: 12
  checkpoint_snapshot_every_periods: 0
  checkpoint_keep_last: 1
  # Keep only useful training history artifacts.
  record_step_history: false
  history_persist_every_periods: 6
  history_plot_every_epochs: 1
  history_plot_final_only: true
  enable_torch_compile: false
  torch_compile_mode: "reduce-overhead"
  autotune_loader:
    enabled: false
    force: false
    candidates_num_workers: [4, 6, 8]
    candidates_prefetch_factor: [2, 4]
    benchmark_steps: 120
    warmup_steps: 30
  erb_bands: 32
  context_frames: 5
  guidance_classic: "none"
  scheduler: "plateau"
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  eval_every: 2
  rank_eval_every: 1
  select_eval_every: 2
  grad_clip: 5.0
  amp: true
  sample_count: 3
  benchmark_seconds: 10
  benchmark_repeats: 3
  cache_eval_audio: true
  final_max_eval_files: 2000
  rank_compute_composite: false
  select_compute_composite: false

stage1:
  families: ["metricgan_plus_native8k_causal_s", "metricgan_plus_native8k_causal_n6"]
  primary_family: "metricgan_plus_native8k_causal_s"
  fallback_family: "metricgan_plus_native8k_causal_n6"
  require_teacher_threshold: true
  seeds: [0]
  loss_recipe: "D1"
  lr: 0.0005
  replay_seed: 42
  evaluate_init_checkpoint: false
  # Intentionally high cap; expected to stop via early stopping.
  epochs: 400
  early_stop_patience: 8
  min_epochs: 15
  target_pesq_floor: 2.8605
  phase_s1:
    lr: 0.0005
    epochs: 24
    early_stop_patience: 6
    min_epochs: 8
  phase_s2:
    lr: 0.0002
    epochs: 12
    early_stop_patience: 4
    min_epochs: 4

qat:
  loss_recipe: "D2"
  lr: 0.0002
  auto_run: false
  replay_seed: 42
  dns_fraction: 1.0
  evaluate_init_checkpoint: false
  # Intentionally high cap; expected to stop via early stopping.
  epochs: 150
  early_stop_patience: 4
  min_epochs: 10

evaluation:
  eval_batch_size: 32
  compute_composite: true

mcu:
  profile: "imx_rt700_ai_audio_rt"

teacher_training:
  families: ["metricgan_plus_native8k"]
  variants: ["small"]
  seeds: [0]
  # If a teacher checkpoint already exists, continue from it on relaunch.
  resume_checkpoint: "auto_if_exists"
  # Resume full training state (optimizer/scheduler/scaler) when available.
  resume_training_state: "auto_if_exists"
  loss_recipe: "T0"
  lr: 0.001
  replay_seed: 42
  evaluate_init_checkpoint: false
  # Intentionally high cap; expected to stop via early stopping.
  epochs: 300
  early_stop_patience: 10
  min_epochs: 20
  target_pesq_floor: 3.1
  phase_a_min_absolute_pesq: 2.0
  phase_a_min_gain_over_init: 0.2
  phase_b_promotion_floor: 2.2
  phase_a:
    lr: 0.00005
    epochs: 6
    early_stop_patience: 3
    min_epochs: 3
    rank_eval_every: 1
    select_eval_every: 2
  phase_b:
    lr: 0.000015
    epochs: 12
    early_stop_patience: 5
    min_epochs: 4
    dns_fraction: 0.25
    rank_eval_every: 1
    select_eval_every: 1
  phase_c:
    lr: 0.000005
    epochs: 6
    early_stop_patience: 3
    min_epochs: 2
    dns_fraction: 0.1
    rank_eval_every: 1
    select_eval_every: 1
  pesq_proxy:
    seed: 42
    max_samples_per_domain: 512
    epochs: 8
    batch_size: 8
    hidden_channels: 32
    projection_dim: 64
    lr: 0.001

reference:
  teacher_run_name: "metricgan_plus_native8k-small-teacher-training-seed0"
  stage1_run_names:
    - "metricgan_plus_native8k_causal_s-small-lr0.0005-seg32000-lossD1-seed0"
  final_qat_run_name: "metricgan_plus_native8k_causal_s-small-lr0.0002-seg32000-lossD2-seed0"

report:
  enabled: false

schema_version: 1
dataset:
  name: VoiceBank+DEMAND
  source_read_only: true
  manifest_root: ${METRICGAN_MANIFEST_ROOT}
  train_fit: ${METRICGAN_MANIFEST_ROOT}/train_fit.csv
  val_rank: ${METRICGAN_MANIFEST_ROOT}/val_rank.csv
  val_select: ${METRICGAN_MANIFEST_ROOT}/val_select.csv
  test: ${METRICGAN_MANIFEST_ROOT}/test.csv
runtime:
  run_root: ${METRICGAN_RUN_ROOT}
  shared_venv: ${METRICGAN_SHARED_VENV}
  device: cuda
model:
  teacher_family: metricgan_plus_teacher_official_wb
  teacher_frontend:
    sample_rate: 16000
    n_fft: 512
    hop_length: 256
    win_length: 512
  student_wb_family: metricgan_plus_student_wb_causal_max
  student_nb_family: metricgan_plus_student_nb_causal_max
  variant: small
  erb_bands: 32
teacher_cache:
  root: ${METRICGAN_RUN_ROOT}/../teacher_cache_store
  cache_inputs: false
  storage_dtype: float16
training:
  seed: 0
  batch_size: 8
  num_workers: 4
  teacher_branch_epochs: 10
  student_epochs: 50
  student_lr_factor: 0.5
  student_lr_patience: 2
  student_min_lr: 1.0e-06
  student_early_stop_patience: 8
  proxy_epochs: 8
  proxy_train_rows: 256
  proxy_validation_rows: 64
  proxy_batch_size: 8
  teacher_branch_lr: 1.0e-05
  teacher_trial_lr: 1.0e-06
  teacher_trial_epochs: 10
  teacher_trial_early_stop_patience: 3
  student_lr: 0.0005
  proxy_lr: 0.001
  metric_discriminator_lr: 0.0005
  metric_discriminator_rows: 100
  metric_discriminator_calibration_rows: 100
  metric_discriminator_history_portion: 0.2
  metric_discriminator_min_calibration_records: 100
  metric_discriminator_max_normalized_mae: 0.06
  metric_discriminator_min_pearson: 0.8
  metric_discriminator_min_spearman: 0.8
  metric_discriminator_min_prediction_std: 0.02
  metric_discriminator_range_tolerance_raw: 0.3
  metric_proxy_weight: 0.25
  teacher_anchor_weight: 0.75
  teacher_min_pesq_gain: 0.01
  teacher_max_stoi_drop: 0.002
  teacher_max_sisdr_drop: 0.25
  grad_clip: 5.0
  amp: true
evaluation:
  eval_batch_size: 8
  sample_count: 3
  compute_composite: false
  benchmark_seconds: 10
  benchmark_repeats: 3
pilot:
  batch_size: 4
  num_workers: 2
  teacher_branch_epochs: 2
  teacher_trial_epochs: 10
  teacher_trial_early_stop_patience: 3
  student_epochs: 3
  proxy_epochs: 4
  proxy_train_rows: 64
  proxy_validation_rows: 16
  proxy_batch_size: 4
  metric_discriminator_rows: 100
  metric_discriminator_calibration_rows: 100
  metric_discriminator_min_calibration_records: 100
  eval_batch_size: 4
  sample_count: 2
  benchmark_seconds: 2
  benchmark_repeats: 2
  early_stop_patience: 2
smoke:
  batch_size: 2
  num_workers: 0
  teacher_branch_epochs: 1
  teacher_trial_epochs: 1
  teacher_trial_early_stop_patience: 0
  student_epochs: 1
  proxy_epochs: 1
  proxy_train_rows: 2
  proxy_validation_rows: 1
  proxy_batch_size: 2
  metric_discriminator_rows: 2
  metric_discriminator_calibration_rows: 2
  metric_discriminator_min_calibration_records: 2
  metric_discriminator_max_normalized_mae: 1.0
  metric_discriminator_min_pearson: -1.0
  metric_discriminator_min_spearman: -1.0
  metric_discriminator_min_prediction_std: 0.0
  metric_discriminator_range_tolerance_raw: 5.0
  eval_batch_size: 2
  sample_count: 1
  benchmark_seconds: 1
  benchmark_repeats: 1

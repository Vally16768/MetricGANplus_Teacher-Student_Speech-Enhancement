schema_version: 1
dataset:
  name: "VoiceBank+DEMAND"
  source_read_only: true
  manifest_root: "${METRICGAN_MANIFEST_ROOT}"
  train_fit: "${METRICGAN_MANIFEST_ROOT}/train_fit.csv"
  val_rank: "${METRICGAN_MANIFEST_ROOT}/val_rank.csv"
  val_select: "${METRICGAN_MANIFEST_ROOT}/val_select.csv"
  test: "${METRICGAN_MANIFEST_ROOT}/test.csv"

runtime:
  run_root: "${METRICGAN_RUN_ROOT}"
  shared_venv: "${METRICGAN_SHARED_VENV}"
  device: "cuda"

model:
  teacher_family: "metricgan_plus_teacher_wb"
  student_wb_family: "metricgan_plus_student_wb_causal_max"
  student_nb_family: "metricgan_plus_student_nb_causal_max"
  variant: "small"
  erb_bands: 32

training:
  seed: 0
  batch_size: 8
  num_workers: 4
  teacher_anchor_epochs: 10
  teacher_branch_epochs: 10
  student_epochs: 20
  proxy_epochs: 8
  proxy_train_rows: 256
  proxy_validation_rows: 64
  proxy_batch_size: 8
  teacher_lr: 0.0005
  teacher_branch_lr: 0.0001
  student_lr: 0.0005
  proxy_lr: 0.001
  metric_proxy_weight: 0.25
  grad_clip: 5.0
  amp: true

evaluation:
  eval_batch_size: 8
  sample_count: 3
  compute_composite: false
  benchmark_seconds: 10
  benchmark_repeats: 3

pilot:
  batch_size: 4
  num_workers: 2
  teacher_anchor_epochs: 2
  teacher_branch_epochs: 2
  student_epochs: 3
  proxy_epochs: 4
  proxy_train_rows: 64
  proxy_validation_rows: 16
  proxy_batch_size: 4
  eval_batch_size: 4
  sample_count: 2
  benchmark_seconds: 2
  benchmark_repeats: 2
  early_stop_patience: 2

smoke:
  batch_size: 2
  num_workers: 0
  teacher_anchor_epochs: 1
  teacher_branch_epochs: 1
  student_epochs: 1
  proxy_epochs: 1
  proxy_train_rows: 2
  proxy_validation_rows: 1
  proxy_batch_size: 2
  eval_batch_size: 2
  sample_count: 1
  benchmark_seconds: 1
  benchmark_repeats: 1
